services:
  # 1. Python ML Service
  - type: web
    name: traffic-ml-service
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r ml-service/requirements.txt"
    startCommand: "cd ml-service && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GEMINI_API_KEY
        sync: false

  # 2. Node.js Backend API
  - type: web
    name: traffic-backend
    env: node
    region: oregon
    plan: free
    buildCommand: "cd backend && npm install"
    startCommand: "cd backend && npm start"
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: traffic-ml-service
          property: url
      - key: FRONTEND_URL
        sync: false

  # 3. Next.js Frontend
  - type: web
    name: traffic-frontend
    env: node
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: traffic-backend
          property: url
          path: /api
      - key: NEXT_PUBLIC_SOCKET_URL
        fromService:
          type: web
          name: traffic-backend
          property: url
